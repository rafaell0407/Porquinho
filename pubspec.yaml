name: porquinho
description: Aplicativo de controle financeiro Porquinho.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  crypto: ^3.0.8
  drift: ^2.35.4
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.4
  http: ^1.6.0
  local_auth: ^3.0.2
  path_provider: ^2.1.6
  sqlite3: ^3.9.1
  supabase_flutter: ^2.18.3

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test_api: 0.7.12
  matcher: 0.12.20

# SQLite3MultipleCiphers (criptografia local; arquitetura.md §17.5).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
